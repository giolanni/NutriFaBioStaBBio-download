<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importa da Instagram · NutriFaBioStaBBio</title>
<style>:root{--g:#496b3b;--c:#f7f3ea;--i:#263126}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 20px}.brand{color:var(--g);font-weight:800;letter-spacing:1.4px;font-size:12px}h1{font:700 38px Georgia,serif;margin:8px 0 12px}.card{background:#fff;border-radius:24px;padding:24px;margin-top:24px;box-shadow:0 10px 30px #26312614}label{display:block;font-weight:800;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #d5d1c8;border-radius:14px;font-size:16px}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:800;font-size:16px}.hint,.status{color:#687066;line-height:1.5}.status{display:none;background:#f1f6ee;padding:14px;border-radius:13px;margin-top:15px}.back{display:inline-block;color:var(--g);font-weight:700;text-decoration:none;margin-top:18px}</style>
</head><body><main class="wrap"><div class="brand">NUTRIFABIOSTABBIO</div><h1>Importa da Instagram</h1><p class="hint">Incolla il link di un Reel pubblico. Il sistema analizzerà il contenuto e preparerà una ricetta modificabile.</p><section class="card"><label for="url">Link del Reel Instagram</label><input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/…" required><button onclick="analyze()">Analizza ricetta</button><div id="status" class="status"></div></section><a class="back" href="./">← Torna alla pagina dell’app</a></main>
<script>function analyze(){const u=document.getElementById('url').value.trim(),s=document.getElementById('status');s.style.display='block';if(!/^https:\/\/(www\.)?instagram\.com\/(reel|p)\//i.test(u)){s.textContent='Inserisci un link pubblico valido di Instagram.';return}s.textContent='Link riconosciuto. Il servizio automatico di analisi verrà collegato al prossimo passaggio.'}</script></body></html>
