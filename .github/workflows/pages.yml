name: Pubblica pagina download

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recupera contenuti
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
