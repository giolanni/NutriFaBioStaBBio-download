name: Compila APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NutriFabioStabbio-prototipo-1.1.zip'
      - '.github/workflows/build-apk.yml'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il progetto
        uses: actions/checkout@v4
      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Estrai il progetto base
        run: unzip -q NutriFabioStabbio-prototipo-1.1.zip -d android-project
      - name: Applica aggiornamenti 1.5.1
        run: |
          cp -R patches/app/. android-project/app/
          mkdir -p android-project/app/src/main/res/drawable
          base64 --decode patches/app/app-icon.webp.base64 > android-project/app/src/main/res/drawable/app_icon.webp
          rm -f android-project/app/app-icon.webp.base64
      - name: Prepara firma stabile del prototipo
        run: echo '' | base64 --decode > android-project/nutrifabio-prototype.keystore
      - name: Compila APK
        run: gradle -p android-project :app:assembleDebug --no-daemon
      - name: Prepara APK per il download
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk NutriFaBioStaBBio-1.5.1.apk
      - name: Pubblica APK nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i 's/1\.5\.0/1.5.1/g' index.html
          git add NutriFaBioStaBBio-1.5.1.apk index.html
          git commit -m "Pubblica APK Nutri FaBio StaBBio 1.5.1"
          git push
